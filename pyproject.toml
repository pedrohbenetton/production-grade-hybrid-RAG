[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Production-grade hybrid RAG: dense + BM25 + RRF + reranking, with claim-level faithfulness guardrails."
license = "MIT"
authors = [
    { name = "pedrohbenetton", email = "pedrohcomisso@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "qdrant-client>=1.20.0",
    "selectolax>=1.0.2",
    "snowballstemmer>=3.1.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# TC (type-checking-only imports) is off: Pydantic resolves annotations at runtime.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "ANN"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src:tests"
untyped_calls_exclude = ["pymupdf"]

[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "snowballstemmer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: touches real parsers/files/stores end-to-end",
    "models: downloads real ML models; opt in with RUN_MODEL_TESTS=1",
]

[tool.coverage.run]
source = ["hybrid_rag"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
